# ══════════════════════════════════════════════════════════════════════════════
# nav2 parameters — tracked AGV (differential drive, two tracks)
# Frame convention: map → odom_filtered → base_link_ekf  (from rtabmap + EKF)
# Smoothness: velocity_smoother + low accel limits + rotate-then-drive in RPP
# ══════════════════════════════════════════════════════════════════════════════

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link_ekf
    odom_topic: /odometry/filtered
    bt_loop_duration: 10
    default_server_timeout: 20
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_globally_updated_goal_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node

# ── Controller Server ──────────────────────────────────────────────────────────
# Uses Regulated Pure Pursuit with rotate-to-heading.
# Tracks rotate in place before driving forward — this eliminates the combined
# turn+drive motion that causes the jerky feel on tracked vehicles.
controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5      # not holonomic
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: progress_checker
    goal_checker_plugins: [goal_checker]
    controller_plugins: [FollowPath]

    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.3
      movement_time_allowance: 15.0

    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.10          # 10 cm position tolerance
      yaw_goal_tolerance: 0.15         # ~9 degree heading tolerance
      stateful: true

    FollowPath:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      # ── Speed limits ─────────────────────────────────────────────────────
      desired_linear_vel: 0.25         # cruise speed [m/s]
      max_linear_accel: 0.15           # very gentle acceleration [m/s²]
      max_linear_decel: 0.25           # deceleration [m/s²]
      # ── Lookahead ────────────────────────────────────────────────────────
      lookahead_dist: 0.6
      min_lookahead_dist: 0.3
      max_lookahead_dist: 0.9
      lookahead_time: 1.5
      use_velocity_scaled_lookahead_dist: false
      # ── Approach ─────────────────────────────────────────────────────────
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 1.0
      # ── Rotation (rotate-then-drive — key for tracked robots) ─────────────
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.5  # ~29°: rotate in place when heading error > this
      rotate_to_heading_angular_vel: 0.35
      max_angular_accel: 0.25           # gentle angular acceleration
      allow_reversing: false
      # ── Collision ────────────────────────────────────────────────────────
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      # ── Regulated scaling ────────────────────────────────────────────────
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.1
      transform_tolerance: 0.2

# ── Velocity Smoother ──────────────────────────────────────────────────────────
# Smooths the raw cmd_vel from the controller before sending to the robot.
# Low accel values are the primary knob for removing jerkiness on tracks.
velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: OPEN_LOOP
    max_velocity: [0.30, 0.0, 0.50]    # [linear_x, linear_y, angular_z]
    min_velocity: [-0.30, 0.0, -0.50]
    max_accel: [0.15, 0.0, 0.25]       # gentle — tracks jerk with high accel
    max_decel: [-0.25, 0.0, -0.40]
    odom_topic: /odometry/filtered
    odom_duration: 0.1
    deadband_velocity: [0.01, 0.0, 0.01]
    velocity_timeout: 1.0

# ── Planner Server ─────────────────────────────────────────────────────────────
planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 1.0
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_navfn_planner/NavfnPlanner
      tolerance: 0.5
      use_astar: false
      allow_unknown: true              # map still being built during SLAM

# ── Behavior Server ────────────────────────────────────────────────────────────
behavior_server:
  ros__parameters:
    use_sim_time: false
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: [spin, backup, wait]
    spin:
      plugin: nav2_behaviors/Spin
    backup:
      plugin: nav2_behaviors/BackUp
    wait:
      plugin: nav2_behaviors/Wait
    global_frame: odom_filtered
    robot_base_frame: base_link_ekf
    transform_timeout: 0.2
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.4
    min_rotational_vel: 0.1
    rotational_acc_lim: 0.25

# ── Local Costmap ──────────────────────────────────────────────────────────────
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom_filtered
      robot_base_frame: base_link_ekf
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      # Tracked AGV footprint: adjust to actual chassis dimensions [m]
      # Format: [[x,y], ...] going around the robot
      footprint: "[[-0.35, -0.30], [-0.35, 0.30], [0.35, 0.30], [0.35, -0.30]]"
      plugins: [obstacle_layer, inflation_layer]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: LaserScan
          raytrace_max_range: 3.5
          raytrace_min_range: 0.0
          obstacle_max_range: 3.0
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 3.0
        inflation_radius: 0.55
      always_send_full_costmap: true

# ── Global Costmap ─────────────────────────────────────────────────────────────
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link_ekf
      track_unknown_space: true
      resolution: 0.05
      footprint: "[[-0.35, -0.30], [-0.35, 0.30], [0.35, 0.30], [0.35, -0.30]]"
      plugins: [static_layer, obstacle_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: false  # rtabmap publishes VOLATILE QoS
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: LaserScan
          raytrace_max_range: 3.5
          raytrace_min_range: 0.0
          obstacle_max_range: 3.0
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 3.0
        inflation_radius: 0.55
      always_send_full_costmap: true

# ── Waypoint Follower ──────────────────────────────────────────────────────────
waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: wait_at_waypoint
    wait_at_waypoint:
      plugin: nav2_waypoint_follower::WaitAtWaypoint
      enabled: true
      waypoint_pause_duration: 0
